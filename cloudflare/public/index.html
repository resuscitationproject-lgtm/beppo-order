<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beppo モバイルオーダー</title><style>body{font-family:system-ui,sans-serif;max-width:42rem;margin:2rem auto;padding:0 1rem;line-height:1.6}label{display:block;margin:.75rem 0}input,button{font:inherit;padding:.6rem;width:100%;box-sizing:border-box}button{background:#24231f;color:#fff;border:0;border-radius:.4rem}</style><body><h1>Beppo モバイルオーダー</h1><p>本日のカレーを来店前に取り置きできます。</p><form id="order"><label>お名前<input name="name" required></label><label>電話番号<input name="phone" required></label><label>受取時間<input name="pickup" type="time" required></label><label>商品ID<input name="productId" value="curry" required></label><button>注文内容を送信</button></form><p id="result" aria-live="polite"></p><script>document.querySelector('#order').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({clientRequestId:crypto.randomUUID(),customerName:f.get('name'),phone:f.get('phone'),pickupTime:f.get('pickup'),items:[{productId:f.get('productId'),quantity:1}]})});document.querySelector('#result').textContent=await r.text()})</script></body></html>
