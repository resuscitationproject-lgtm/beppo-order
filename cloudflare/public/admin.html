<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beppo admin</title><style>body{font-family:system-ui,sans-serif;max-width:50rem;margin:2rem auto;padding:0 1rem}label{display:block;margin:.5rem 0}input,button{font:inherit;padding:.5rem}fieldset{margin:1rem 0}#result{white-space:pre-wrap}</style><body><h1>Beppo admin</h1><label>管理トークン<input id="token" type="password"></label><fieldset><legend>開店前レジ金確認</legend><label>期待金額<input id="expected" type="number" value="10000"></label><label>1,000円札<input id="n1000" type="number" value="10"></label><label>100円硬貨<input id="n100" type="number" value="0"></label><button id="cash">レジ金を確認</button></fieldset><fieldset><legend>商品・原価</legend><label>商品ID<input id="pid" value="curry"></label><label>商品名<input id="pname" value="Sri Lankan Rice & Curry"></label><label>販売価格<input id="sale" type="number" value="1200"></label><label>原価<input id="cost" type="number" value="430"></label><button id="product">保存</button></fieldset><label>CSV期間（開始）<input id="from" type="date"></label><label>CSV期間（終了）<input id="to" type="date"></label><button id="csv">日計・週計CSVを取得</button><pre id="result"></pre><script>const $=id=>document.getElementById(id),auth=()=>({Authorization:'Bearer '+$('token').value,'content-type':'application/json'});$('cash').onclick=async()=>{const r=await fetch('/api/admin/opening-cash',{method:'POST',headers:auth(),body:JSON.stringify({expectedAmount:+$('expected').value,denominations:{1000:+$('n1000').value,100:+$('n100').value},confirmedBy:'admin'})});$('result').textContent=await r.text()};$('product').onclick=async()=>{const r=await fetch('/api/admin/products',{method:'POST',headers:auth(),body:JSON.stringify({id:$('pid').value,name:$('pname').value,category:'main',salePrice:+$('sale').value,costPrice:+$('cost').value})});$('result').textContent=await r.text()};$('csv').onclick=async()=>{const q=new URLSearchParams({from:$('from').value,to:$('to').value});const r=await fetch('/api/admin/reports.csv?'+q,{headers:{Authorization:'Bearer '+$('token').value}});if(!r.ok){$('result').textContent=await r.text();return}const blob=await r.blob();const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='beppo-report.csv';link.click();URL.revokeObjectURL(link.href)}</script></body></html>
